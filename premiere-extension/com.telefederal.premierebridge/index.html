<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TELEFEDERAL Bridge</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      body { background: #111722; color: #f4f7fb; margin: 0; padding: 14px; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      .status { border: 1px solid #344052; padding: 10px; }
      .online { color: #44d7b6; }
      .offline { color: #ff6b6b; }
      button { background: #263346; border: 1px solid #4b5c75; color: #fff; font-weight: 700; margin: 8px 6px 0 0; min-height: 34px; padding: 0 12px; }
      pre { color: #b9c4d5; font-size: 11px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>TELEFEDERAL Bridge</h1>
    <div class="status">
      <div id="status" class="offline">Conectando...</div>
      <button id="playButton" type="button">Play</button>
      <button id="stopButton" type="button">Stop</button>
    </div>
    <pre id="log"></pre>
    <script src="./js/main.js"></script>
  </body>
</html>
